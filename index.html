<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tsobena Tourism - Home</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&family=Open+Sans:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <header class="navbar">
        <div class="nav-container">
            <a href="index.html" class="logo-text">
                <img src="images/logo.png">
            </a>
            <nav class="nav-menu">
                <a href="index.html" class="nav-item active">Home</a>
                <a href="pages/about.html" class="nav-item">About Us</a>
                <a href="pages/destination.html" class="nav-item">Destinations</a>
                <a href="pages/tours.html" class="nav-item">Tours</a>
                <a href="pages/gallery.html" class="nav-item">Gallery</a>
                <a href="pages/contact.html" class="nav-item">Contact Us</a>
            </nav> 
        </div>
    </header>

    <main>
        <section class="hero-home">
            <div class="hero-overlay"></div>
            <div class="hero-card">
                <span class="badge-tag">Discover. Explore. Experience</span>
                <h1 class="hero-title">Discover Botswana <br><span class="highlight-text">with Tsobena Tourism</span></h1>
                <p class="hero-description">
                    Experience unforgettable adventures, breathtaking landscapes, wildlife, culture, and exciting destinations with Tsobena Tourism.
                </p>
            </div>
        </section>
    </main>

    <!-- BOOKING MODAL -->
    <div id="booking-modal" class="modal-backdrop">
        <div class="modal-box">
            <h2>Book Your Adventure</h2>
            <form onsubmit="handleBooking(event)">
                <input type="text" id="modal-pkg" placeholder="Tour or Destination" class="input-field">
                <input type="text" placeholder="Full Name" required class="input-field">
                <input type="email" placeholder="Email Address" required class="input-field">
                <input type="date" required class="input-field">
            </form>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
